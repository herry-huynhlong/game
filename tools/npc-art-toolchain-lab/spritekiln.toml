# SpriteKiln project settings (https://github.com/LucasJRamos/spritekiln).
# Commands run anywhere inside this folder find this file.

[project]
specs = "specs"        # where `spritekiln new` creates specs
engine = "generic"       # godot | unity | monogame | generic
ai = ["generic"]       # assistants whose files `spritekiln update` refreshes

[export]
# `spritekiln export <spec>` (or `render --export`) copies the atlas, JSON and maps here;
# for Godot it also writes SpriteFrames, a CanvasTexture and a ready scene.
dir = "export"

[defaults]                # given to specs created by `spritekiln new`
view = "topdown"
size = 64
palette = "xianxia.yaml"
camera = { pitch = 38, scale = 0.044 }
directions = 4

[style]                   # the art style every asset follows (`spritekiln style`); change it only when asked
recorded = 2026-11-20
view = "topdown"
height = 40               # px on screen of a human-sized character
scale = 0.044             # camera.scale of every asset (from height)
size = 64                 # frame px for that character
directions = 4
mirror = false
palette = "xianxia.yaml"
colors = ""
outline = "selective"
outline_color = ""        # with outline "dark"; empty: the darkest tone of the ramps
shading = "toon"
lines = "depth"
highlights = true
dither = "none"
light = "top"
proportions = "stylized"
face = "detailed"         # minimal: eyes only, no nose; simple: + a hint of brow or nose on big heads; detailed
animation = "fluid"
snap = true               # root and torso move in whole pixels
references = []
notes = "Chinese xianxia, upright daoist robes, top-left teal jade cream gold, clean compact forms; avoid European knights and oversized accessories"
