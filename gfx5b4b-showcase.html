<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh Vân Ký · Xem mẫu nhân vật</title>
<style>body{margin:0;background:#17261e;color:#eee4c6;font-family:system-ui,sans-serif}main{max-width:1040px;margin:0 auto;padding:20px}h1{font-size:21px}p{color:#c4ccac}#controls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}button{background:#304439;color:#f1e4c7;border:1px solid #71836b;border-radius:4px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#887448;color:white}#game{border:1px solid #51664f;max-width:100%;overflow:auto}canvas{display:block;image-rendering:pixelated}</style></head>
<body><main><h1>Thanh Vân Ký · Mẫu nhân vật</h1><p>Cảnh xem mỹ thuật độc lập: chọn hướng và tư thế để quan sát năm mẫu. Ngồi, trúng đòn và tử vong hiện được vẽ hướng trước.</p><div id="controls" aria-label="Chọn hướng và hoạt ảnh"><button data-action="idle" aria-pressed="true">Đứng</button><button data-action="walk" aria-pressed="false">Đi</button><button data-action="sit_enter">Ngồi xuống</button><button data-action="cultivate">Ngồi thiền</button><button data-action="sit_exit">Đứng dậy</button><button data-action="hit">Trúng đòn</button><button data-action="death">Gục xuống</button><button data-direction="up">Bắc</button><button data-direction="up_right">Đông Bắc</button><button data-direction="right">Đông</button><button data-direction="down_right">Đông Nam</button><button data-direction="down" aria-pressed="true">Nam</button><button data-direction="down_left">Tây Nam</button><button data-direction="left">Tây</button><button data-direction="up_left">Tây Bắc</button><button data-zoom="1.15" aria-pressed="true">Zoom game</button><button data-zoom="2">Zoom 2×</button></div><div id="game"></div></main><script type="module" src="/src/gfx5b4b-showcase.ts"></script></body></html>
