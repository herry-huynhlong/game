name: Build and release Thanh Van Ky

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run system tests
        run: npm run test:systems

      - name: Validate release inputs
        run: node scripts/validate-release.mjs

      - name: Build production site
        run: npm run build

      - name: Validate production output
        run: node scripts/validate-release.mjs --dist

      - name: Package static release and checksum
        shell: bash
        run: |
          mkdir -p release
          release_version="${GITHUB_REF_NAME//\//-}"
          tar -czf "release/thanh-van-ky-${release_version}.tar.gz" -C dist .
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thanh-van-ky-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
